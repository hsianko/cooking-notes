<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小日子">
<meta name="theme-color" content="#F7F1E4">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>小日子</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');

:root{
  --bg:#F7F1E4; --card:#FFFCF4; --cardBorder:#E6DCC4;
  --ink:#3B2F22; --muted:#9C8A6E; --sage:#7C8B5E; --sageDark:#5F6E45;
  --rust:#C1622C; --rustSoft:#EFDCC9;
  --red:#C1453D; --redSoft:#F5DCD9;
  --orange:#D98A3D; --orangeSoft:#F5E7D0;
}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:'IBM Plex Sans TC', sans-serif; padding-bottom:96px;
  -webkit-font-smoothing:antialiased;
}
input::placeholder, textarea::placeholder{ color:#B9AC91; }
select{ -webkit-appearance:none; appearance:none; }
input[type="date"]{ -webkit-appearance:none; appearance:none; min-width:0; max-width:100%; }
button{ font-family:inherit; }

.header-wrap{
  padding:24px 20px 14px; border-bottom:1px solid var(--cardBorder);
  background:linear-gradient(180deg,#FBF6EA,#F7F1E4);
  position:sticky; top:0; z-index:25;
}
.header-row{ display:flex; align-items:center; gap:12px; }
.logo{
  width:40px; height:40px; border-radius:12px; background:var(--rustSoft);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:20px;
}
h1{ font-family:'Fraunces',serif; font-weight:600; font-size:22px; margin:0; letter-spacing:0.01em; display:flex; align-items:center; gap:8px; }
.ver-badge{
  font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted);
  background:var(--card); border:1px solid var(--cardBorder); border-radius:20px; padding:2px 9px;
  cursor:pointer;
}
.subtitle{ margin:2px 0 0; font-size:12.5px; color:var(--muted); }
.clock{ margin:6px 0 0; font-size:12px; color:var(--muted); font-family:'IBM Plex Mono',monospace; }

/* reminder banners - shown above all tabs */
.reminder-wrap{ padding:12px 20px 0; max-width:640px; margin:0 auto; }
.reminder-banner{
  border-radius:12px; padding:10px 12px; margin-bottom:8px;
  background:var(--redSoft); border:1px solid #E3B6AF; color:#8A342C;
  display:flex; align-items:center; gap:8px; font-size:12.5px; cursor:pointer;
}
.reminder-banner.today{ background:var(--orangeSoft); border-color:#E8C48E; color:#8A5A1F; }
.reminder-banner b{ font-weight:700; }

.modal-overlay{
  display:none; position:fixed; inset:0; background:rgba(59,47,34,0.45);
  align-items:flex-end; justify-content:center; z-index:50;
}
.modal-overlay.show{ display:flex; }
.modal-sheet{
  background:var(--card); width:100%; max-width:640px; border-radius:18px 18px 0 0;
  padding:20px 20px 28px; max-height:75vh; overflow-y:auto;
}
.modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.modal-title{ font-family:'Fraunces',serif; font-weight:600; font-size:17px; }
.ver-entry{ margin-bottom:16px; padding-bottom:16px; border-bottom:1px solid var(--cardBorder); }
.ver-entry:last-child{ border-bottom:none; margin-bottom:0; padding-bottom:0; }
.ver-entry-head{ display:flex; align-items:baseline; gap:8px; margin-bottom:6px; }
.ver-num{ font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--rust); font-weight:600; }
.ver-date{ font-size:11.5px; color:var(--muted); }
.ver-list{ margin:0; padding-left:18px; font-size:13px; color:#5A4A36; line-height:1.8; }

.body-wrap{ padding:16px 20px 0; max-width:640px; margin:0 auto; }
.tabpanel{ display:none; }
.tabpanel.active{ display:block; }

.add-big-btn{
  width:100%; padding:13px; border-radius:12px; border:1.5px dashed var(--rust);
  background:var(--rustSoft); color:var(--rust); font-size:14px; font-weight:600;
  display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
  margin-bottom:18px;
}

.form-card{
  background:var(--card); width:100%; max-width:640px; border-radius:18px 18px 0 0;
  padding:20px 20px 28px; max-height:80vh; overflow-y:auto;
}
.form-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.form-title{ font-family:'Fraunces',serif; font-weight:600; font-size:16px; }
.icon-btn{ border:none; background:transparent; cursor:pointer; padding:4px; display:flex; align-items:center; }
label.field-label{ display:block; font-size:12px; color:var(--muted); margin-bottom:6px; margin-top:12px; font-weight:500; }
.field{
  width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--cardBorder);
  background:#FFFEFA; font-size:14px; color:var(--ink); font-family:inherit; box-sizing:border-box; outline:none;
}
textarea.field{ min-height:56px; resize:vertical; }
.row2{ display:flex; gap:12px; }
.save-btn{
  width:100%; margin-top:18px; padding:12px; border-radius:10px; border:none;
  background:var(--sage); color:#fff; font-size:14px; font-weight:600; cursor:pointer;
}
.del-form-btn{
  width:100%; margin-top:10px; padding:11px; border-radius:10px; border:1px solid var(--redSoft);
  background:transparent; color:var(--red); font-size:13.5px; font-weight:600; cursor:pointer;
}

.empty{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:44px 20px; gap:10px; }
.empty-text{ color:var(--muted); font-size:13px; margin:0; }
.empty-icon{ font-size:30px; opacity:0.35; }

.list{ display:flex; flex-direction:column; gap:12px; }
.recipe-card{
  background:var(--card); border:1px solid var(--cardBorder); border-radius:14px; padding:16px;
  box-shadow:0 1px 6px rgba(59,47,34,0.04);
}
.recipe-top{ display:flex; justify-content:space-between; align-items:flex-start; }
.recipe-name{ font-family:'Fraunces',serif; font-weight:600; font-size:17px; }
.tag-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.tag{ font-size:11.5px; padding:3px 9px; border-radius:20px; background:#EFE7D3; color:var(--sageDark); font-weight:500; }
.tag-time{ background:var(--rustSoft); color:var(--rust); font-family:'IBM Plex Mono',monospace; }
.notes-row{ display:flex; margin-top:10px; align-items:flex-start; font-size:12.5px; color:#6B5A42; line-height:1.5; }
.add-to-cart-btn{
  margin-top:12px; border:none; background:transparent; color:var(--sageDark);
  font-size:12.5px; font-weight:600; padding:0; cursor:pointer; display:flex; align-items:center;
}
.ing-toggle{
  margin-top:12px; font-size:12.5px; color:var(--rust); font-weight:600;
  display:flex; align-items:center; gap:5px; cursor:pointer; user-select:none;
}
.ing-arrow{ transition:transform .2s; display:inline-block; }
.ing-arrow.open{ transform:rotate(180deg); }
.ing-body{ max-height:0; overflow:hidden; transition:max-height .25s ease; }
.ing-body.open{ max-height:200px; }
.ing-body-inner{ padding-top:10px; }
.ing-chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
.ing-chip{ font-size:11.5px; padding:4px 10px; border-radius:20px; background:#FFFFFF; border:1px solid var(--cardBorder); color:var(--ink); }

.shop-input-row{ display:flex; gap:8px; margin-bottom:18px; }
.add-small-btn{
  width:42px; border-radius:9px; border:none; background:var(--sage); cursor:pointer;
  display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#fff; font-size:20px; font-weight:600;
}
.shop-row{
  display:flex; align-items:center; gap:10px; background:var(--card);
  border:1px solid var(--cardBorder); border-radius:12px; padding:12px 14px;
}
.shop-row.checked{ opacity:0.55; }
.checkbox{
  width:19px; height:19px; border-radius:6px; border:1.5px solid var(--cardBorder);
  display:flex; align-items:center; justify-content:center; background:#FFFEFA; cursor:pointer; flex-shrink:0;
}
.checkbox.on{ background:var(--sage); border-color:var(--sage); color:#fff; font-size:12px; }
.shop-item-name{ font-size:14px; font-weight:500; }
.shop-item-name.checked{ text-decoration:line-through; color:var(--muted); }
.from-tag{ display:block; font-size:11px; color:var(--muted); margin-top:2px; }
.clear-btn{
  width:100%; margin-top:16px; padding:11px; border-radius:10px; border:1px solid var(--cardBorder);
  background:transparent; color:var(--muted); font-size:13px; cursor:pointer;
}
.checkout-block{ margin-top:18px; padding-top:14px; border-top:1px solid var(--cardBorder); }
.checkout-summary{ display:flex; justify-content:space-between; align-items:baseline; font-size:13px; margin-bottom:10px; }
.checkout-summary .amt{ font-family:'IBM Plex Mono',monospace; font-size:19px; font-weight:700; color:var(--ink); }
.checkout-btn{
  width:100%; padding:12px; border-radius:10px; border:none; background:var(--sage);
  color:#fff; font-size:14px; font-weight:600; cursor:pointer; margin-bottom:8px;
}

.toast{
  position:fixed; bottom:96px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:#FBF6EA; padding:10px 18px; border-radius:30px;
  font-size:12.5px; box-shadow:0 4px 16px rgba(0,0,0,0.2); opacity:0; pointer-events:none; transition:opacity .2s;
  z-index:60; max-width:88vw; text-align:center;
}
.toast.show{ opacity:1; }

/* ===== Bottom tab bar ===== */
.bottom-bar{
  position:fixed; bottom:0; left:0; right:0; background:var(--card);
  border-top:1px solid var(--cardBorder); display:flex; padding:8px 6px calc(14px + env(safe-area-inset-bottom));
  max-width:640px; margin:0 auto; z-index:30;
}
.bt-item{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:11px; color:var(--muted); position:relative; cursor:pointer; padding:6px 0;
  border:none; background:transparent;
}
.bt-item svg{ width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.8; }
.bt-item .label-pill{ padding:3px 12px; border-radius:20px; }
.bt-item.active{ color:var(--rust); font-weight:700; }
.bt-item.active .label-pill{ background:var(--rustSoft); }
.bt-badge{
  position:absolute; top:-2px; right:22%; background:var(--rust); color:#fff;
  font-size:9px; font-weight:700; border-radius:20px; min-width:15px; height:15px;
  display:flex; align-items:center; justify-content:center; padding:0 3px;
  font-family:'IBM Plex Mono',monospace;
}

/* ===== 記帳 ===== */
.money-summary{ background:var(--card); border:1px solid var(--cardBorder); border-radius:14px; padding:16px; margin-bottom:14px; }
.month-total{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.month-nav{ display:flex; align-items:center; gap:8px; }
.month-nav-btn{ border:none; background:var(--rustSoft); color:var(--rust); width:26px; height:26px; border-radius:8px; font-size:13px; cursor:pointer; }
.month-nav-btn:disabled{ opacity:0.35; }
.month-total .lbl{ font-size:12px; color:var(--muted); }
.month-total .val{ font-family:'IBM Plex Mono',monospace; font-size:24px; font-weight:700; color:var(--ink); }

.cat-bar-row{ padding:8px 0; cursor:pointer; }
.cat-bar-head{ display:flex; justify-content:space-between; align-items:baseline; font-size:13px; margin-bottom:5px; }
.cat-bar-head .pct{ font-size:11px; color:var(--muted); margin-left:4px; }
.cat-bar-head .amt{ font-family:'IBM Plex Mono',monospace; font-size:13px; }
.cat-bar-track{ height:7px; background:var(--rustSoft); border-radius:0; }
.cat-bar-fill{ height:100%; background:var(--sage); }
.cat-bar-row.active .cat-bar-fill{ background:var(--rust); }
.cat-bar-row.active .cat-bar-head{ font-weight:700; }

.payer-row{ display:flex; gap:8px; }
.payer-chip{
  flex:1; padding:11px; border-radius:11px; border:1.5px solid var(--cardBorder);
  background:#fff; text-align:center; font-size:13.5px; font-weight:600; color:var(--muted);
  cursor:pointer;
}
.payer-chip.active{ border-color:var(--sage); background:#EFF3E9; color:var(--sageDark); }
.payer-chip.active.partner{ border-color:var(--blue,#5C7FA6); background:#DDE6EE; color:#3E5B7A; }

.payer-badge{ font-size:10px; padding:2px 7px; border-radius:20px; font-weight:600; margin-left:6px; }
.payer-badge.me{ background:#EFF3E9; color:var(--sageDark); }
.payer-badge.partner{ background:#DDE6EE; color:#3E5B7A; }

.settle-card{ background:var(--card); border:1px solid var(--cardBorder); border-radius:14px; padding:16px; margin-bottom:14px; }
.settle-title{ font-size:12px; color:var(--muted); margin-bottom:10px; font-weight:600; }
.settle-row{ display:flex; justify-content:space-between; margin-bottom:8px; font-size:13px; }
.settle-row b{ font-family:'IBM Plex Mono',monospace; }
.settle-result{
  margin-top:8px; padding:10px 12px; background:#FBF6EA; border-radius:10px;
  font-size:12.5px; color:var(--ink); text-align:center; font-weight:600;
}

.expense-row{ display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--cardBorder); }
.expense-row:last-child{ border-bottom:none; }
.expense-left{ display:flex; align-items:center; gap:10px; }
.expense-icon{ width:36px; height:36px; border-radius:10px; background:var(--rustSoft); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.expense-info .name{ font-size:13.5px; font-weight:600; }
.expense-info .meta{ font-size:11px; color:var(--muted); margin-top:1px; }
.expense-amt{ font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:600; color:var(--rust); display:flex; align-items:center; gap:8px; }
.date-label{ font-size:11px; color:var(--muted); font-weight:600; margin:14px 0 4px; text-transform:uppercase; letter-spacing:.03em; }

.camera-fab{
  position:fixed; right:20px; bottom:104px; width:52px; height:52px; border-radius:50%;
  background:var(--sage); color:#fff; display:flex; align-items:center; justify-content:center;
  font-size:22px; box-shadow:0 4px 14px rgba(95,110,69,0.4); border:none; cursor:pointer; z-index:30;
}

/* ===== 待辦 ===== */
.todo-group{ margin-bottom:20px; }
.todo-group-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:2px; }
.todo-group-label{ font-size:11px; font-weight:700; letter-spacing:.1em; color:var(--rust); text-transform:uppercase; }
.todo-group-count{ font-size:11px; color:var(--muted); }
.todo-row{ display:flex; align-items:flex-start; gap:10px; padding:12px 0; border-bottom:1px solid var(--cardBorder); }
.todo-row:last-child{ border-bottom:none; }
.todo-row.done .todo-name{ text-decoration:line-through; color:var(--muted); }
.todo-name{ flex:1; font-size:13.5px; }
.todo-due{ font-size:10.5px; color:var(--muted); margin-top:2px; }
.todo-link{
  display:inline-block; margin-top:5px; font-size:11.5px; color:var(--rust);
  border-bottom:1px solid var(--rustSoft); cursor:pointer;
}
.pri-tag{ font-size:10px; padding:3px 8px; border-radius:20px; font-weight:600; flex-shrink:0; }
.pri-high{ background:var(--redSoft); color:#8A342C; }
.pri-normal{ background:#EFE7D3; color:var(--sageDark); }
.todo-group-empty{ font-size:12.5px; color:var(--muted); padding:9px 0; }

/* ===== 首頁 ===== */
.greeting{ font-size:13px; color:var(--muted); margin:10px 0 0; }
.greeting b{ color:var(--ink); font-family:'Fraunces',serif; font-weight:600; font-size:16px; }
.section-card{
  background:var(--card); border:1px solid var(--cardBorder); border-radius:16px;
  padding:16px; margin-bottom:14px; box-shadow:0 1px 6px rgba(59,47,34,0.04); cursor:pointer;
}
.home-headline{ font-family:'Fraunces',serif; font-weight:700; font-size:20px; margin:2px 0 10px; }
.sc-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.sc-title{ display:flex; align-items:center; gap:8px; font-family:'Fraunces',serif; font-weight:600; font-size:15.5px; }
.sc-title .emoji{ font-size:17px; }
.sc-link{ font-size:11.5px; color:var(--rust); font-weight:600; }
.recipe-preview{ display:flex; align-items:center; gap:10px; }
.recipe-thumb{ width:44px; height:44px; border-radius:11px; background:var(--rustSoft); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
.recipe-info .name{ font-weight:600; font-size:14px; }
.recipe-info .meta{ font-size:11.5px; color:var(--muted); margin-top:2px; }
.shop-chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:2px; }
.shop-chip{ font-size:11.5px; padding:5px 11px; border-radius:20px; background:#EFE7D3; color:var(--sageDark); }
.home-summary{ font-size:12.5px; color:var(--muted); margin:0 0 10px; }
.home-summary b{ color:var(--sageDark); font-family:'IBM Plex Mono',monospace; }
.money-row{ display:flex; justify-content:space-between; align-items:baseline; }
.money-amt{ font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:700; color:var(--ink); }
.money-sub{ font-size:11.5px; color:var(--muted); margin-top:4px; }
.money-cats{ display:flex; gap:6px; margin-top:10px; }
.money-cat-mini{ flex:1; background:#FBF6EA; border-radius:8px; padding:8px; text-align:center; }
.money-cat-mini .n{ font-size:10.5px; color:var(--muted); }
.money-cat-mini .v{ font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; margin-top:2px; }
.todo-mini-row{ display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--cardBorder); }
.todo-mini-row:last-child{ border-bottom:none; }
.todo-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.todo-dot.high{ background:var(--red); }
.todo-dot.normal{ background:var(--sage); }
.todo-mini-name{ flex:1; font-size:13px; }
.todo-mini-due{ font-size:10.5px; color:var(--red); font-family:'IBM Plex Mono',monospace; }
.todo-mini-due.today{ color:var(--orange); }
.todo-mini-due.none{ color:var(--muted); }
.qa-btn{
  padding:10px; border-radius:10px; border:1.5px dashed var(--rust);
  background:var(--rustSoft); color:var(--rust); font-size:12.5px; font-weight:600;
  text-align:center; margin-top:4px; cursor:pointer;
}
</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({ appId: "2cad1b7c-0742-429f-ad78-6f89eb0a2630" });
  });
</script>
</head>
<body>

<div class="header-wrap">
  <div class="header-row">
    <div class="logo">📖</div>
    <div>
      <h1>小日子 <button class="ver-badge" id="verBadgeBtn">v4.6</button></h1>
      <p class="subtitle" id="subtitleText">今天也要好好過生活</p>
      <p class="clock" id="clockText"></p>
    </div>
  </div>
</div>

<div class="reminder-wrap" id="reminderWrap"></div>

<div class="body-wrap">

  <!-- 首頁 -->
  <section class="tabpanel active" id="home">
    <div class="section-card" id="homeTodoCard">
      <div class="sc-head">
        <span class="sc-title"><span class="emoji">✅</span>待辦事項</span>
        <span class="sc-link">查看全部 ›</span>
      </div>
      <div class="home-headline" id="homeTodoHeadline"></div>
      <div id="homeTodoList"></div>
    </div>

    <div class="section-card" id="homeMoneyCard">
      <div class="sc-head">
        <span class="sc-title"><span class="emoji">💰</span>本月支出</span>
        <span class="sc-link">查看明細 ›</span>
      </div>
      <div id="homeMoneyBody"></div>
    </div>

    <div class="section-card" id="homeRecipeCard">
      <div class="sc-head">
        <span class="sc-title"><span class="emoji">🍳</span>料理紀錄</span>
        <span class="sc-link">查看全部 ›</span>
      </div>
      <div id="homeRecipeBody"></div>
    </div>

    <div class="section-card" id="homeShopCard">
      <div class="sc-head">
        <span class="sc-title"><span class="emoji">🧺</span>採買清單</span>
        <span class="sc-link">查看全部 ›</span>
      </div>
      <div id="homeShopBody"></div>
    </div>
  </section>

  const d = new Date();
  const weekday = ['日','一','二','三','四','五','六'][d.getDay()];

  const el = document.getElementById('clockText');
  if(el) el.textContent = text;
}

async function restoreFromCloud(){
  showToast('從雲端讀取資料中...');
  try {
    const res = await fetch(SHEET_API_URL + '?token=' + encodeURIComponent(SHEET_TOKEN));
    const data = await res.json();
    if(data.error) throw new Error(data.error);

    if(Array.isArray(data.expenses)) {
      expenses = data.expenses.map(e=>({
        id: e.id || Date.now().toString()+Math.random(),
        date: (e.date||'').slice(0,10), category: e.category, amount: Number(e.amount),
        payment: e.payment, payer: e.payer || 'me', note: e.note || ''
      }));
      saveExpenses();
    }
    if(Array.isArray(data.recipes)) {
      recipes = data.recipes.map(r=>({
        id: r.id || Date.now().toString()+Math.random(),
        name: r.name, tool: r.tool, mode: r.mode, time: r.time, notes: r.notes, ingredients: r.ingredients
      }));
      saveRecipes();
    }
    if(Array.isArray(data.shopping)) {
      shopping = data.shopping.map(i=>({ id:i.id, name:i.name, checked:!!i.checked, from:i.from||null }));
      saveShopping();
    }
    if(Array.isArray(data.todos)) {
      todos = data.todos.map(t=>({ id:t.id, name:t.name, priority:t.priority||'normal', due:t.due||null, done:!!t.done, link:t.link||null }));
      saveTodos();
    }

    renderRecipes(); renderShopping(); renderCategoryChips(); renderExpenses(); renderTodos(); renderReminders();
    showToast('已從雲端還原資料');
  } catch(err){
    showToast('還原失敗，請確認網路連線');
  }
}

function renderCategoryChips(){
  const wrap = document.getElementById('catBarWrap');
  const { ym } = targetYm();
  const monthAll = expenses.filter(e=> e.date && e.date.startsWith(ym));
  const sums = {};
  monthAll.forEach(e=>{ sums[e.category] = (sums[e.category]||0) + Number(e.amount); });
  const total = monthAll.reduce((s,e)=>s+Number(e.amount),0);
  const barColors = ['var(--rust)','var(--sage)','var(--orange)','var(--red)','var(--sageDark)'];
  const cats = categories.filter(c=> sums[c] > 0).sort((a,b)=> sums[b]-sums[a]);

  if(cats.length===0){
    wrap.innerHTML = '';
    return;
  }
  wrap.innerHTML = cats.map((c,i)=>{
    const amt = sums[c];
    const pct = total>0 ? Math.round(amt/total*100) : 0;
    return `
      <div class="cat-bar-row ${c===activeCategory?'active':''}" data-cat="${c}">
        <div class="cat-bar-head">
          <span>${c}<span class="pct">${pct}%</span></span>
          <span class="amt">$${amt.toLocaleString()}</span>
        </div>
        <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${pct}%; background:${barColors[i%barColors.length]};"></div></div>
      </div>
    `;
  }).join('');
  wrap.querySelectorAll('.cat-bar-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const c = row.dataset.cat;
      activeCategory = (activeCategory === c) ? '全部' : c;
      renderCategoryChips();
      renderExpenses();
    });
  });
}

function targetYm(){
  const d = new Date();
  d.setMonth(d.getMonth() + monthOffset);
  return { year: d.getFullYear(), month: d.getMonth()+1, ym: d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0') };
}

function renderExpenses(){
  const wrap = document.getElementById('expenseListWrap');
  const emptyEl = document.getElementById('moneyEmpty');
  const { month, ym } = targetYm();

  const filtered = expenses.filter(e=> e.date && e.date.startsWith(ym) && (activeCategory==='全部'||e.category===activeCategory));

  emptyEl.style.display = filtered.length===0 ? 'flex' : 'none';
  wrap.innerHTML = '';

  const monthSum = filtered.reduce((s,e)=>s+Number(e.amount),0);
  document.getElementById('monthTotal').textContent = '$' + monthSum.toLocaleString();
  document.getElementById('monthLabel').textContent = `${month}月支出${activeCategory==='全部'?'':'（'+activeCategory+'）'}`;
  document.getElementById('nextMonthBtn').disabled = monthOffset >= 0;

  // 本月結算（不受類別篩選影響，統計整個月）
  const monthAll = expenses.filter(e=> e.date && e.date.startsWith(ym));
  const mePaid = monthAll.filter(e=>e.payer!=='partner').reduce((s,e)=>s+Number(e.amount),0);
  const partnerPaid = monthAll.filter(e=>e.payer==='partner').reduce((s,e)=>s+Number(e.amount),0);
  const settleBody = document.getElementById('settleBody');
  if(monthAll.length===0){
    settleBody.innerHTML = `<p style="font-size:12.5px; color:var(--muted); margin:0;">${month}月還沒有支出紀錄</p>`;
  } else {
    const diff = Math.round((mePaid - partnerPaid)/2);

function compressImageToBase64(file, maxWidth){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
        resolve(dataUrl.split(',')[1]); // 只取base64本體
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// 專門給OCR用的前處理：提高解析度、轉灰階、加強對比，PNG無損輸出，改善辨識準確度
function preprocessImageForOCR(file, maxWidth){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);

        const imgData = ctx.getImageData(0, 0, w, h);
        const d = imgData.data;
        const gray = new Uint8ClampedArray(w*h);
        const hist = new Array(256).fill(0);
        for(let i=0; i<d.length; i+=4){
          const g = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
          gray[i/4] = g;
          hist[Math.round(g)]++;
        }
        // 用百分位數（排除最暗/最亮各2%的雜訊像素，避免被背景極端值帶偏）取代單純min/max
        const total = w*h;
        let lo = 0, hi = 255, acc = 0;
        for(let v=0; v<256; v++){ acc += hist[v]; if(acc >= total*0.02){ lo = v; break; } }
        acc = 0;
        for(let v=255; v>=0; v--){ acc += hist[v]; if(acc >= total*0.02){ hi = v; break; } }
        const range = Math.max(1, hi-lo);
        for(let i=0; i<d.length; i+=4){
          let g = gray[i/4];
          g = (g - lo) / range * 255;
          if(g<0) g=0; if(g>255) g=255;
          d[i] = d[i+1] = d[i+2] = g;
        }
        ctx.putImageData(imgData, 0, 0);

        const dataUrl = canvas.toDataURL('image/png');
        resolve(dataUrl);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function cleanOcrText(text){
  // Tesseract辨識中文常會在每個字中間插入多餘空白，這裡把它清掉
  let cleaned = text;
  for (let i=0; i<3; i++){
    cleaned = cleaned.replace(/([\u4e00-\u9fff])[ \t]+(?=[\u4e00-\u9fff])/g, '$1');
  }
  return cleaned.replace(/[ \t]{2,}/g, ' ').trim();
}

function guessAmountFromText(text){
  // 優先抓「$」開頭的數字，取最大值（收據金額通常都有錢字符號，且總金額通常是$數字裡最大的一個；
  // 交易編號、商品重量(如200g)不會有$符號，可有效避開這類干擾）
  const dollarNums = (text.match(/\$\s?[\d,]+(?:\.\d+)?/g) || [])
    .map(s => parseFloat(s.replace(/[$,\s]/g,'')))
    .filter(n => n > 0 && n < 1000000);
  if(dollarNums.length > 0) return Math.max(...dollarNums);

  // 完全沒有$符號時，才退回找「小計/合計/應付」等關鍵字附近的數字，容許OCR在中文字間插入空白
  const keywords = ['小計','小結','合計','總計','總金額','應付金額','應付','實付','實收','消費金額','信用卡','現金'];
  for (const kw of keywords){
    const fuzzyKw = kw.split('').join('\\s*');
    const re = new RegExp(fuzzyKw + '[^\\d]{0,8}([\\d,]{1,9}(?:\\.\\d+)?)');
    const m = text.match(re);
    if (m){
      const n = parseFloat(m[1].replace(/,/g,''));
      if (n > 0 && n < 1000000) return n;
    }
  }

  // 最後備用：抓辨識出來的數字裡最大的那個（可能不準，需要人工確認）
  const nums = (text.match(/\d[\d,]*(\.\d+)?/g) || [])
    .map(s => parseFloat(s.replace(/,/g,'')))
    .filter(n => n > 0 && n < 1000000);
  if(nums.length===0) return '';
  return Math.max(...nums);
}

// 給雲端OCR用：單純縮圖，不做灰階/對比處理（雲端服務自己會處理彩色照片）
function getResizedDataUrl(file, maxWidth, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function ocrSpaceRecognize(imgDataUrl){
  const form = new FormData();
  form.append('apikey', OCR_SPACE_KEY);
  form.append('base64Image', imgDataUrl);
  form.append('language', 'cht');
  form.append('OCREngine', '2');
  form.append('scale', 'true');
  form.append('isOverlayRequired', 'false');
  const res = await fetch('https://api.ocr.space/parse/image', { method:'POST', body: form });
  const data = await res.json();
  if(data.IsErroredOnProcessing){
    throw new Error(Array.isArray(data.ErrorMessage) ? data.ErrorMessage.join(', ') : (data.ErrorMessage || 'OCR.space 辨識失敗'));
  }
  const text = (data.ParsedResults && data.ParsedResults[0] && data.ParsedResults[0].ParsedText) || '';
  if(!text.trim()) throw new Error('雲端辨識沒有讀到文字');
  return text;
}

document.getElementById('cameraInput').addEventListener('change', async function(){
  const file = this.files && this.files[0];
  this.value = '';
  if(!file) return;

  showToast('雲端辨識中，請稍候...');
  try {
    const dataUrl = await getResizedDataUrl(file, 1600, 0.85);
    const text = await ocrSpaceRecognize(dataUrl);
    fillExpenseFormWithOcrText(text);
    showToast('雲端辨識完成，請確認金額後儲存');
    return;
  } catch(cloudErr){
    showToast('雲端辨識失敗，改用手機本機辨識...');
  }

  // 雲端失敗時，退回本機辨識當備援
  try {
    const imgSrc = await preprocessImageForOCR(file, 1800);
    const result = await Tesseract.recognize(imgSrc, 'chi_tra+eng', {
      logger: m=>{
        if(m.status === 'recognizing text'){
          showToast('本機辨識中... ' + Math.round(m.progress*100) + '%');
        }
      }
    });
    const rawText = result.data.text || '';
    if(!rawText.trim()){
      showToast('沒有辨識出文字，請手動輸入');
      editingExpenseId = null;
      document.getElementById('expenseFormTitle').textContent = '新增支出';
      document.getElementById('e-date').value = todayStr();
      renderCategorySelect();
      renderPaymentSelect();
      expenseFormCard.classList.add('show');
    } else {
      fillExpenseFormWithOcrText(rawText);
      showToast('本機辨識完成，請確認金額後儲存');
    }
  } catch(localErr){
    showToast('辨識時發生錯誤，請改用手動輸入');
    editingExpenseId = null;
    document.getElementById('expenseFormTitle').textContent = '新增支出';
    document.getElementById('e-date').value = todayStr();
    renderCategorySelect();
    renderPaymentSelect();
    expenseFormCard.classList.add('show');
  }
});

function generateICSForTodo(t){
  const dt = t.due.replace(/-/g,''); // YYYYMMDD
  const startTime = dt + 'T090000';
  const endTime = dt + 'T093000';
  const now = new Date();
  const dtstamp = now.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const uid = 'xiaorizi-todo-' + t.id + '@xiaorizi.app';
  const summary = (t.name || '待辦事項').replace(/[\r\n]/g,' ');
  return [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//小日子//Todo//ZH',
    'BEGIN:VEVENT',
    'UID:'+uid,
    'DTSTAMP:'+dtstamp,
    'DTSTART:'+startTime,
    'DTEND:'+endTime,
    'SUMMARY:'+summary,
    'BEGIN:VALARM',
    'ACTION:DISPLAY',
    'DESCRIPTION:'+summary,
    'TRIGGER:-PT0M',
    'END:VALARM',
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');
}

function addTodoToCalendar(id){
  const t = todos.find(x=>x.id===id);
  if(!t || !t.due){ showToast('請先設定到期日期才能加入提醒'); return; }
  const ics = generateICSForTodo(t);
  const dataUri = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
  window.open(dataUri, '_blank');
}

function renderTodos(){

  const today = todayStr();
  const overdue = todos.filter(t=>!t.done && t.due && t.due < today);
  const dueToday = todos.filter(t=>!t.done && t.due && t.due === today);
  const later = todos.filter(t=>!t.done && !(t.due && t.due <= today));
  const done = todos.filter(t=>t.done);

  const groups = [
    { label: '逾期', items: overdue },
    { label: '今天', items: dueToday },
    { label: '之後', items: later },
    { label: '已完成', items: done },
  ];

  if(todos.length>0){
    groups.forEach(g=>{
      const groupEl = document.createElement('div');
      groupEl.className = 'todo-group';

    todoListEl.innerHTML = todoPreview.map(t=>{
      let dueLabel = '未設期限', dueCls = 'none';
      if(t.due && t.due < today){ dueLabel = '已逾期'; dueCls = ''; }
      else if(t.due && t.due === today){ dueLabel = '今天到期'; dueCls = 'today'; }
      else if(t.due){ dueLabel = t.due; dueCls = 'none'; }
      return `<div class="todo-mini-row">
        <span class="todo-dot ${t.priority==='high'?'high':'normal'}"></span>
        <span class="todo-mini-name">${t.name}</span>
        <span class="todo-mini-due ${dueCls}">${dueLabel}</span>
      </div>`;
    }).join('');
  }

  // 記帳：本月總額 + 依類別拆分
  const ym = todayStr().slice(0,7);
  const monthExpenses = expenses.filter(e=>e.date && e.date.startsWith(ym));
  const total = monthExpenses.reduce((s,e)=>s+Number(e.amount),0);
  const byCat = {};
  monthExpenses.forEach(e=>{ byCat[e.category] = (byCat[e.category]||0) + Number(e.amount); });
  const topCats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,3);

  const moneyBody = document.getElementById('homeMoneyBody');
  const monthNum = new Date().getMonth()+1;
  if(monthExpenses.length===0){
    moneyBody.innerHTML = `<p class="home-summary" style="margin:0;">${monthNum}月還沒有記帳紀錄</p>`;
  } else {
    moneyBody.innerHTML = `
      <div class="money-row">
        <span class="money-amt">$${total.toLocaleString()}</span>
        <span class="money-sub">${monthNum}月支出</span>
      </div>
      <div class="money-cats">
        ${topCats.map(([cat,amt])=>`<div class="money-cat-mini"><div class="n">${cat}</div><div class="v">$${amt.toLocaleString()}</div></div>`).join('')}
      </div>
    `;
  }

  // 料理：最近一筆
  const recipeBody = document.getElementById('homeRecipeBody');
  if(recipes.length===0){
    recipeBody.innerHTML = `
      <p class="home-summary" style="margin:0 0 4px;">還沒有任何料理紀錄</p>
      <div class="qa-btn" id="homeAddRecipeBtn">＋ 新增第一道料理</div>
    `;
  } else {
    const r = recipes[0];
    const metaParts = [r.tool];
    if(r.mode) metaParts.push(r.mode);
    if(r.time) metaParts.push(r.time);
    recipeBody.innerHTML = `
      <div class="recipe-preview">
        <div class="recipe-thumb">🍽️</div>
        <div class="recipe-info">
          <div class="name">最近新增：${r.name}</div>
          <div class="meta">${metaParts.join(' · ')}</div>
        </div>
      </div>
      <div class="qa-btn" id="homeAddRecipeBtn">＋ 新增今天煮的菜</div>
    `;
  }
  const addRecipeBtn = document.getElementById('homeAddRecipeBtn');
  if(addRecipeBtn){
    addRecipeBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      goTab('recipes');
      setTimeout(()=> document.getElementById('openFormBtn').click(), 250);
    });
  }

  // 採買：未購買項目
  const shopBody = document.getElementById('homeShopBody');
  const unchecked = shopping.filter(i=>!i.checked);
  if(unchecked.length===0){
    shopBody.innerHTML = '<p class="home-summary" style="margin:0;">採買清單是空的，暫時不用買東西 👍</p>';
  } else {
    shopBody.innerHTML = `
      <p class="home-summary">還有 <b>${unchecked.length}</b> 項還沒買：</p>
      <div class="shop-chip-row">
        ${unchecked.slice(0,6).map(i=>`<span class="shop-chip">${i.name}</span>`).join('')}
        ${unchecked.length>6 ? `<span class="shop-chip">+${unchecked.length-6}</span>` : ''}
      </div>
    `;
  }
}

/* ============ 初始化 ============ */
renderRecipes();
renderShopping();
renderCategoryChips();
renderExpenses();
renderTodos();
renderReminders();
renderHome();
</script>
</body>
</html>
