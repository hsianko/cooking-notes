<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小日子">
<meta name="theme-color" content="#F7F1E4">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>小日子</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');

:root{
  --bg:#F7F1E4; --card:#FFFCF4; --cardBorder:#E6DCC4;
  --ink:#3B2F22; --muted:#9C8A6E; --sage:#7C8B5E; --sageDark:#5F6E45;
  --rust:#C1622C; --rustSoft:#EFDCC9;
  --red:#C1453D; --redSoft:#F5DCD9;
  --orange:#D98A3D; --orangeSoft:#F5E7D0;
}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:'IBM Plex Sans TC', sans-serif; padding-bottom:96px;
  -webkit-font-smoothing:antialiased;
}
input::placeholder, textarea::placeholder{ color:#B9AC91; }
select{ -webkit-appearance:none; appearance:none; }
input[type="date"]{ -webkit-appearance:none; appearance:none; min-width:0; max-width:100%; }
button{ font-family:inherit; }

.header-wrap{
  padding:24px 20px 14px; border-bottom:1px solid var(--cardBorder);
  background:linear-gradient(180deg,#FBF6EA,#F7F1E4);
}
.header-row{ display:flex; align-items:center; gap:12px; }
.logo{
  width:40px; height:40px; border-radius:12px; background:var(--rustSoft);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:20px;
}
h1{ font-family:'Fraunces',serif; font-weight:600; font-size:22px; margin:0; letter-spacing:0.01em; display:flex; align-items:center; gap:8px; }
.ver-badge{
  font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted);
  background:var(--card); border:1px solid var(--cardBorder); border-radius:20px; padding:2px 9px;
  cursor:pointer;
}
.subtitle{ margin:2px 0 0; font-size:12.5px; color:var(--muted); }
.clock{ margin:6px 0 0; font-size:12px; color:var(--muted); font-family:'IBM Plex Mono',monospace; }

/* reminder banners - shown above all tabs */
.reminder-wrap{ padding:12px 20px 0; max-width:640px; margin:0 auto; }
.reminder-banner{
  border-radius:12px; padding:10px 12px; margin-bottom:8px;
  background:var(--redSoft); border:1px solid #E3B6AF; color:#8A342C;
  display:flex; align-items:center; gap:8px; font-size:12.5px; cursor:pointer;
}
.reminder-banner.today{ background:var(--orangeSoft); border-color:#E8C48E; color:#8A5A1F; }
.reminder-banner b{ font-weight:700; }

.modal-overlay{
  display:none; position:fixed; inset:0; background:rgba(59,47,34,0.45);
  align-items:flex-end; justify-content:center; z-index:50;
}
.modal-overlay.show{ display:flex; }
.modal-sheet{
  background:var(--card); width:100%; max-width:640px; border-radius:18px 18px 0 0;
  padding:20px 20px 28px; max-height:75vh; overflow-y:auto;
}
.modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.modal-title{ font-family:'Fraunces',serif; font-weight:600; font-size:17px; }
.ver-entry{ margin-bottom:16px; padding-bottom:16px; border-bottom:1px solid var(--cardBorder); }
.ver-entry:last-child{ border-bottom:none; margin-bottom:0; padding-bottom:0; }
.ver-entry-head{ display:flex; align-items:baseline; gap:8px; margin-bottom:6px; }
.ver-num{ font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--rust); font-weight:600; }
.ver-date{ font-size:11.5px; color:var(--muted); }
.ver-list{ margin:0; padding-left:18px; font-size:13px; color:#5A4A36; line-height:1.8; }

.body-wrap{ padding:16px 20px 0; max-width:640px; margin:0 auto; }
.tabpanel{ display:none; }
.tabpanel.active{ display:block; }

.add-big-btn{
  width:100%; padding:13px; border-radius:12px; border:1.5px dashed var(--rust);
  background:var(--rustSoft); color:var(--rust); font-size:14px; font-weight:600;
  display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
  margin-bottom:18px;
}

.form-card{
  background:var(--card); border:1px solid var(--cardBorder); border-radius:14px;
  padding:18px; margin-bottom:20px; box-shadow:0 2px 10px rgba(59,47,34,0.05); display:none;
}
.form-card.show{ display:block; }
.form-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.form-title{ font-family:'Fraunces',serif; font-weight:600; font-size:16px; }
.icon-btn{ border:none; background:transparent; cursor:pointer; padding:4px; display:flex; align-items:center; }
label.field-label{ display:block; font-size:12px; color:var(--muted); margin-bottom:6px; margin-top:12px; font-weight:500; }
.field{
  width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--cardBorder);
  background:#FFFEFA; font-size:14px; color:var(--ink); font-family:inherit; box-sizing:border-box; outline:none;
}
textarea.field{ min-height:56px; resize:vertical; }
.row2{ display:flex; gap:12px; }
.save-btn{
  width:100%; margin-top:18px; padding:12px; border-radius:10px; border:none;
  background:var(--sage); color:#fff; font-size:14px; font-weight:600; cursor:pointer;
}

.empty{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:44px 20px; gap:10px; }
.empty-text{ color:var(--muted); font-size:13px; margin:0; }
.empty-icon{ font-size:30px; opacity:0.35; }

.list{ display:flex; flex-direction:column; gap:12px; }
.recipe-card{
  background:var(--card); border:1px solid var(--cardBorder); border-radius:14px; padding:16px;
  box-shadow:0 1px 6px rgba(59,47,34,0.04);
}
.recipe-top{ display:flex; justify-content:space-between; align-items:flex-start; }
.recipe-name{ font-family:'Fraunces',serif; font-weight:600; font-size:17px; }
.tag-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.tag{ font-size:11.5px; padding:3px 9px; border-radius:20px; background:#EFE7D3; color:var(--sageDark); font-weight:500; }
.tag-time{ background:var(--rustSoft); color:var(--rust); font-family:'IBM Plex Mono',monospace; }
.notes-row{ display:flex; margin-top:10px; align-items:flex-start; font-size:12.5px; color:#6B5A42; line-height:1.5; }
.add-to-cart-btn{
  margin-top:12px; border:none; background:transparent; color:var(--sageDark);
  font-size:12.5px; font-weight:600; padding:0; cursor:pointer; display:flex; align-items:center;
}
.ing-toggle{
  margin-top:12px; font-size:12.5px; color:var(--rust); font-weight:600;
  display:flex; align-items:center; gap:5px; cursor:pointer; user-select:none;
}
.ing-arrow{ transition:transform .2s; display:inline-block; }
.ing-arrow.open{ transform:rotate(180deg); }
.ing-body{ max-height:0; overflow:hidden; transition:max-height .25s ease; }
.ing-body.open{ max-height:200px; }
.ing-body-inner{ padding-top:10px; }
.ing-chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
.ing-chip{ font-size:11.5px; padding:4px 10px; border-radius:20px; background:#FFFFFF; border:1px solid var(--cardBorder); color:var(--ink); }

.shop-input-row{ display:flex; gap:8px; margin-bottom:18px; }
.add-small-btn{
  width:42px; border-radius:9px; border:none; background:var(--sage); cursor:pointer;
  display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#fff; font-size:20px; font-weight:600;
}
.shop-row{
  display:flex; align-items:center; gap:10px; background:var(--card);
  border:1px solid var(--cardBorder); border-radius:12px; padding:12px 14px;
}
.shop-row.checked{ opacity:0.55; }
.checkbox{
  width:19px; height:19px; border-radius:6px; border:1.5px solid var(--cardBorder);
  display:flex; align-items:center; justify-content:center; background:#FFFEFA; cursor:pointer; flex-shrink:0;
}
.checkbox.on{ background:var(--sage); border-color:var(--sage); color:#fff; font-size:12px; }
.shop-item-name{ font-size:14px; font-weight:500; }
.shop-item-name.checked{ text-decoration:line-through; color:var(--muted); }
.from-tag{ display:block; font-size:11px; color:var(--muted); margin-top:2px; }
.clear-btn{
  width:100%; margin-top:16px; padding:11px; border-radius:10px; border:1px solid var(--cardBorder);
  background:transparent; color:var(--muted); font-size:13px; cursor:pointer;
}

.toast{
  position:fixed; bottom:96px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:#FBF6EA; padding:10px 18px; border-radius:30px;
  font-size:12.5px; box-shadow:0 4px 16px rgba(0,0,0,0.2); opacity:0; pointer-events:none; transition:opacity .2s;
  z-index:40; max-width:88vw; text-align:center;
}
.toast.show{ opacity:1; }

/* ===== Bottom tab bar ===== */
.bottom-bar{
  position:fixed; bottom:0; left:0; right:0; background:var(--card);
  border-top:1px solid var(--cardBorder); display:flex; padding:8px 6px calc(14px + env(safe-area-inset-bottom));
  max-width:640px; margin:0 auto; z-index:30;
}
.bt-item{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:10.5px; color:var(--muted); position:relative; cursor:pointer; padding:4px 0;
  border:none; background:transparent;
}
.bt-item .icon{ font-size:20px; }
.bt-item.active{ color:var(--rust); font-weight:600; }
.bt-badge{
  position:absolute; top:-2px; right:22%; background:var(--rust); color:#fff;
  font-size:9px; font-weight:700; border-radius:20px; min-width:15px; height:15px;
  display:flex; align-items:center; justify-content:center; padding:0 3px;
  font-family:'IBM Plex Mono',monospace;
}

/* ===== 記帳 ===== */
.money-summary{ background:var(--card); border:1px solid var(--cardBorder); border-radius:14px; padding:16px; margin-bottom:14px; }
.month-total{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.month-nav{ display:flex; align-items:center; gap:8px; }
.month-nav-btn{ border:none; background:var(--rustSoft); color:var(--rust); width:26px; height:26px; border-radius:8px; font-size:13px; cursor:pointer; }
.month-nav-btn:disabled{ opacity:0.35; }
.month-total .lbl{ font-size:12px; color:var(--muted); }
.month-total .val{ font-family:'IBM Plex Mono',monospace; font-size:24px; font-weight:700; color:var(--ink); }
.chip-row{ display:flex; gap:6px; flex-wrap:wrap; }
.chip{ font-size:11.5px; padding:5px 12px; border-radius:20px; background:#fff; border:1px solid var(--cardBorder); color:var(--sageDark); cursor:pointer; }
.chip.active{ background:var(--sage); color:#fff; border-color:var(--sage); }
.chip.add-chip{ color:var(--rust); border-color:var(--rust); background:var(--rustSoft); }

.expense-row{ display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--cardBorder); }
.expense-row:last-child{ border-bottom:none; }
.expense-left{ display:flex; align-items:center; gap:10px; }
.expense-icon{ width:36px; height:36px; border-radius:10px; background:var(--rustSoft); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.expense-info .name{ font-size:13.5px; font-weight:600; }
.expense-info .meta{ font-size:11px; color:var(--muted); margin-top:1px; }
.expense-amt{ font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:600; color:var(--rust); display:flex; align-items:center; gap:8px; }
.date-label{ font-size:11px; color:var(--muted); font-weight:600; margin:14px 0 4px; text-transform:uppercase; letter-spacing:.03em; }

.camera-fab{
  position:fixed; right:20px; bottom:104px; width:52px; height:52px; border-radius:50%;
  background:var(--sage); color:#fff; display:flex; align-items:center; justify-content:center;
  font-size:22px; box-shadow:0 4px 14px rgba(95,110,69,0.4); border:none; cursor:pointer; z-index:30;
}

/* ===== 待辦 ===== */
.todo-row{ display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--cardBorder); }
.todo-row:last-child{ border-bottom:none; }
.todo-row.done .todo-name{ text-decoration:line-through; color:var(--muted); }
.todo-name{ flex:1; font-size:13.5px; }
.todo-due{ font-size:10.5px; color:var(--muted); margin-top:2px; }
.pri-tag{ font-size:10px; padding:3px 8px; border-radius:20px; font-weight:600; flex-shrink:0; }
.pri-high{ background:var(--redSoft); color:#8A342C; }
.pri-normal{ background:#EFE7D3; color:var(--sageDark); }
</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

<div class="header-wrap">
  <div class="header-row">
    <div class="logo">📖</div>
    <div>
      <h1>小日子 <button class="ver-badge" id="verBadgeBtn">v3.0</button></h1>
      <p class="subtitle" id="subtitleText">烹煮方式 · 時間 · 採買清單</p>
      <p class="clock" id="clockText"></p>
    </div>
  </div>
</div>

<div class="reminder-wrap" id="reminderWrap"></div>

<div class="body-wrap">

  <!-- 料理紀錄 -->
  <section class="tabpanel active" id="recipes">
    <button class="add-big-btn" id="openFormBtn">＋ 新增料理紀錄</button>

    <div class="form-card" id="formCard">
      <div class="form-head">
        <span class="form-title" id="formTitleText">新增料理紀錄</span>
        <button class="icon-btn" id="closeFormBtn">✕</button>
      </div>
      <label class="field-label">料理名稱</label>
      <input class="field" id="f-name" placeholder="例如：巴沙魚">

      <div class="row2">
        <div style="flex:1;">
          <label class="field-label">烹調工具</label>
          <select class="field" id="f-tool">
            <option>氣炸鍋</option><option>電鍋</option><option>炒鍋</option>
            <option>烤箱</option><option>電磁爐</option><option>蒸鍋</option><option>其他</option>
          </select>
        </div>
        <div style="flex:1;">
          <label class="field-label">模式</label>
          <input class="field" id="f-mode" placeholder="例如：氣炸模式">
        </div>
      </div>

      <label class="field-label">溫度/時間</label>
      <input class="field" id="f-time" placeholder="例如：180°C，18-20分鐘">

      <label class="field-label">備註</label>
      <textarea class="field" id="f-notes" placeholder="例如：中間需翻面"></textarea>

      <label class="field-label">需要的食材（選填，用逗號或換行分隔）</label>
      <textarea class="field" id="f-ingredients" placeholder="例如：巴沙魚, 檸檬, 黑胡椒"></textarea>

      <button class="save-btn" id="saveBtn">儲存</button>
    </div>

    <div class="empty" id="recipesEmpty" style="display:none;">
      <div class="empty-icon">🍳</div>
      <p class="empty-text">還沒有紀錄，點上面按鈕新增第一道料理</p>
    </div>

    <div class="list" id="recipeList"></div>
  </section>

  <!-- 採買清單 -->
  <section class="tabpanel" id="shopping">
    <div class="shop-input-row">
      <input class="field" id="newItemInput" placeholder="新增採買項目" style="flex:1;">
      <button class="add-small-btn" id="addItemBtn">＋</button>
    </div>

    <div class="empty" id="shoppingEmpty" style="display:none;">
      <div class="empty-icon">🧺</div>
      <p class="empty-text">採買清單是空的</p>
    </div>

    <div class="list" id="shopList"></div>

    <button class="clear-btn" id="clearBtn" style="display:none;">清除已購買項目</button>
  </section>

  <!-- 記帳 -->
  <section class="tabpanel" id="money">
    <div class="money-summary">
      <div class="month-total">
        <div class="month-nav">
          <button class="month-nav-btn" id="prevMonthBtn">◀</button>
          <span class="lbl" id="monthLabel">本月支出</span>
          <button class="month-nav-btn" id="nextMonthBtn">▶</button>
        </div>
        <span class="val" id="monthTotal">$0</span>
      </div>
      <div class="chip-row" id="catChipRow"></div>
    </div>

    <button class="add-big-btn" id="openExpenseFormBtn">＋ 新增支出</button>

    <div class="form-card" id="expenseFormCard">
      <div class="form-head">
        <span class="form-title" id="expenseFormTitle">新增支出</span>
        <button class="icon-btn" id="closeExpenseFormBtn">✕</button>
      </div>

      <label class="field-label">日期</label>
      <input class="field" type="date" id="e-date">

      <label class="field-label">類別</label>
      <select class="field" id="e-category"></select>

      <label class="field-label">金額</label>
      <input class="field" type="number" inputmode="numeric" id="e-amount" placeholder="例如：680">

      <label class="field-label">付款方式</label>
      <select class="field" id="e-payment"></select>

      <label class="field-label">備註（選填）</label>
      <textarea class="field" id="e-note" placeholder="例如：貓咪飼料" style="min-height:70px;"></textarea>

      <button class="save-btn" id="saveExpenseBtn">儲存</button>
    </div>

    <div class="empty" id="moneyEmpty" style="display:none;">
      <div class="empty-icon">💰</div>
      <p class="empty-text">還沒有支出紀錄</p>
    </div>

    <div id="expenseListWrap"></div>

    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
    <button class="camera-fab" id="cameraBtn">📷</button>
  </section>

  <!-- 待辦 -->
  <section class="tabpanel" id="todo">
    <button class="add-big-btn" id="openTodoFormBtn">＋ 新增待辦事項</button>

    <div class="form-card" id="todoFormCard">
      <div class="form-head">
        <span class="form-title" id="todoFormTitle">新增待辦事項</span>
        <button class="icon-btn" id="closeTodoFormBtn">✕</button>
      </div>
      <label class="field-label">事項名稱</label>
      <input class="field" id="t-name" placeholder="例如：幫貓咪買飼料">

      <label class="field-label">優先順序</label>
      <select class="field" id="t-priority">
        <option value="normal">普通</option>
        <option value="high">急</option>
      </select>

      <label class="field-label">到期日期（選填，設定後才會出現在頂端提醒）</label>
      <input class="field" type="date" id="t-due">

      <button class="save-btn" id="saveTodoBtn">儲存</button>
    </div>

    <div class="empty" id="todoEmpty" style="display:none;">
      <div class="empty-icon">✅</div>
      <p class="empty-text">目前沒有待辦事項</p>
    </div>

    <div class="list" id="todoList"></div>
  </section>

</div>

<div class="bottom-bar" id="bottomBar">
  <button class="bt-item active" data-tab="recipes"><span class="icon">🍳</span>料理</button>
  <button class="bt-item" data-tab="shopping"><span class="icon">🧺</span>採買<span class="bt-badge" id="shopBadge" style="display:none;">0</span></button>
  <button class="bt-item" data-tab="money"><span class="icon">💰</span>記帳</button>
  <button class="bt-item" data-tab="todo"><span class="icon">✅</span>待辦<span class="bt-badge" id="todoBadge" style="display:none;">0</span></button>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="verModal">
  <div class="modal-sheet">
    <div class="modal-head">
      <span class="modal-title">版本紀錄</span>
      <button class="icon-btn" id="closeVerBtn">✕</button>
    </div>
    <div id="verList"></div>
  </div>
</div>

<script>
/* ============ 共用工具 ============ */
const STORAGE_RECIPES = 'zaobian-recipes';
const STORAGE_SHOPPING = 'zaobian-shopping';
const STORAGE_EXPENSES = 'xiaorizi-expenses';
const STORAGE_CATEGORIES = 'xiaorizi-categories';
const STORAGE_PAYMENTS = 'xiaorizi-payments';
const STORAGE_TODOS = 'xiaorizi-todos';

const SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbxlpVAUCOimnIqwrOBq54cpKHt9QoyipLyJu43BPV-etN2eS0dprYCB99ylM_qY3CE/exec';
const SHEET_TOKEN = 'xiaorizi2026';
const OCR_SPACE_KEY = 'K83629190388957';

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function updateClock(){
  const d = new Date();
  const weekday = ['日','一','二','三','四','五','六'][d.getDay()];
  const text = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}（週${weekday}） ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  const el = document.getElementById('clockText');
  if(el) el.textContent = text;
}
updateClock();
setInterval(updateClock, 1000*30);

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=> t.classList.remove('show'), 2200);
}

document.getElementById('saveBtn').addEventListener('click', ()=>{

  const data = {
    name,
    tool: document.getElementById('f-tool').value,
    mode: document.getElementById('f-mode').value.trim(),
    time: document.getElementById('f-time').value.trim(),
    notes: document.getElementById('f-notes').value.trim(),
    ingredients: document.getElementById('f-ingredients').value.trim(),
  };

    recipes = recipes.map(r=> r.id===editingId ? { ...r, ...data } : r);

    recipes.unshift({ id: Date.now().toString(), ...data });

function ingList(recipe){
  return recipe.ingredients.split(/[,、\n]/).map(s=>s.trim()).filter(Boolean);
}
function addIngredientsToShopping(recipe){
  const list = ingList(recipe);
  if(list.length===0){ showToast('這道料理沒有登記食材'); return; }
  const existingNames = new Set(shopping.filter(i=>!i.checked).map(i=>i.name));
  const additions = list.filter(n=>!existingNames.has(n)).map(n=>({
    id: Date.now().toString()+Math.random(), name:n, checked:false, from:recipe.name
  }));
  shopping = [...additions, ...shopping];
  saveShopping();
  renderShopping();
  showToast(`已將「${recipe.name}」的食材加入採買清單`);
}
function renderRecipes(){
  const listEl = document.getElementById('recipeList');
  const emptyEl = document.getElementById('recipesEmpty');
  listEl.innerHTML = '';
  emptyEl.style.display = recipes.length===0 ? 'flex' : 'none';
  recipes.forEach(r=>{
    const card = document.createElement('div');
    card.className = 'recipe-card';
    card.innerHTML = `
      <div class="recipe-top">
        <span class="recipe-name"></span>
        <div style="display:flex; gap:2px;">
          <button class="icon-btn edit-btn">✏️</button>
          <button class="icon-btn del-btn">🗑</button>
        </div>
      </div>
      <div class="tag-row">
        <span class="tag"></span>
        ${r.mode ? '<span class="tag mode-tag"></span>' : ''}
        ${r.time ? '<span class="tag tag-time">⏱ <span class="time-text"></span></span>' : ''}
      </div>
      ${r.notes ? '<div class="notes-row">📝&nbsp;<span class="notes-text"></span></div>' : ''}
      ${r.ingredients ? `
        <div class="ing-toggle">🧾 查看食材（${ingList(r).length}項）<span class="ing-arrow">▾</span></div>
        <div class="ing-body"><div class="ing-body-inner">
          <div class="ing-chip-row"></div>
          <button class="add-to-cart-btn">食材加入採買清單 →</button>
        </div></div>
      ` : ''}
    `;
    card.querySelector('.recipe-name').textContent = r.name;
    card.querySelector('.tag').textContent = r.tool;
    if(r.mode) card.querySelector('.mode-tag').textContent = r.mode;
    if(r.time) card.querySelector('.time-text').textContent = r.time;
    if(r.notes) card.querySelector('.notes-text').textContent = r.notes;
    card.querySelector('.edit-btn').addEventListener('click', ()=>editRecipe(r.id));
    card.querySelector('.del-btn').addEventListener('click', ()=>deleteRecipe(r.id));
    if(r.ingredients){
      const chipRow = card.querySelector('.ing-chip-row');
      ingList(r).forEach(n=>{
        const chip = document.createElement('span');
        chip.className = 'ing-chip';
        chip.textContent = n;
        chipRow.appendChild(chip);
      });
      const toggle = card.querySelector('.ing-toggle');
      const body = card.querySelector('.ing-body');
      const arrow = card.querySelector('.ing-arrow');
      toggle.addEventListener('click', ()=>{
        body.classList.toggle('open');
        arrow.classList.toggle('open');
      });
      card.querySelector('.add-to-cart-btn').addEventListener('click', ()=>addIngredientsToShopping(r));
    }
    listEl.appendChild(card);
  });
}

function renderShopping(){
  const listEl = document.getElementById('shopList');
  const emptyEl = document.getElementById('shoppingEmpty');
  const clearBtn = document.getElementById('clearBtn');
  const badge = document.getElementById('shopBadge');
  listEl.innerHTML = '';
  emptyEl.style.display = shopping.length===0 ? 'flex' : 'none';
  const uncheckedCount = shopping.filter(i=>!i.checked).length;
  if(uncheckedCount>0){ badge.style.display='flex'; badge.textContent=uncheckedCount; }
  else { badge.style.display='none'; }
  clearBtn.style.display = shopping.some(i=>i.checked) ? 'block' : 'none';
  shopping.forEach(item=>{
    const row = document.createElement('div');
    row.className = 'shop-row' + (item.checked ? ' checked' : '');
    row.innerHTML = `
      <div class="checkbox ${item.checked?'on':''}">${item.checked?'✓':''}</div>

function targetYm(){
  const d = new Date();
  d.setMonth(d.getMonth() + monthOffset);
  return { year: d.getFullYear(), month: d.getMonth()+1, ym: d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0') };
}

document.getElementById('prevMonthBtn').addEventListener('click', ()=>{
  monthOffset -= 1;
  renderExpenses();
});
document.getElementById('nextMonthBtn').addEventListener('click', ()=>{
  if(monthOffset >= 0) return;
  monthOffset += 1;
  renderExpenses();
});

function renderExpenses(){
  const wrap = document.getElementById('expenseListWrap');
  const emptyEl = document.getElementById('moneyEmpty');
  const { month, ym } = targetYm();

  const filtered = expenses.filter(e=> e.date && e.date.startsWith(ym) && (activeCategory==='全部'||e.category===activeCategory));

  emptyEl.style.display = filtered.length===0 ? 'flex' : 'none';
  wrap.innerHTML = '';

  const monthSum = filtered.reduce((s,e)=>s+Number(e.amount),0);
  document.getElementById('monthTotal').textContent = '$' + monthSum.toLocaleString();
  document.getElementById('monthLabel').textContent = `${month}月支出${activeCategory==='全部'?'':'（'+activeCategory+'）'}`;
  document.getElementById('nextMonthBtn').disabled = monthOffset >= 0;

  const byDate = {};
  filtered.forEach(e=>{ (byDate[e.date] = byDate[e.date]||[]).push(e); });
  const dates = Object.keys(byDate).sort().reverse();

  dates.forEach(date=>{
    const label = document.createElement('div');
    label.className = 'date-label';
    label.textContent = date === todayStr() ? '今天' : date;
    wrap.appendChild(label);

    const card = document.createElement('div');

function compressImageToBase64(file, maxWidth){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
        resolve(dataUrl.split(',')[1]); // 只取base64本體
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// 專門給OCR用的前處理：提高解析度、轉灰階、加強對比，PNG無損輸出，改善辨識準確度
function preprocessImageForOCR(file, maxWidth){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);

        const imgData = ctx.getImageData(0, 0, w, h);
        const d = imgData.data;
        const gray = new Uint8ClampedArray(w*h);
        const hist = new Array(256).fill(0);
        for(let i=0; i<d.length; i+=4){
          const g = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
          gray[i/4] = g;
          hist[Math.round(g)]++;
        }
        // 用百分位數（排除最暗/最亮各2%的雜訊像素，避免被背景極端值帶偏）取代單純min/max
        const total = w*h;
        let lo = 0, hi = 255, acc = 0;
        for(let v=0; v<256; v++){ acc += hist[v]; if(acc >= total*0.02){ lo = v; break; } }
        acc = 0;
        for(let v=255; v>=0; v--){ acc += hist[v]; if(acc >= total*0.02){ hi = v; break; } }
        const range = Math.max(1, hi-lo);
        for(let i=0; i<d.length; i+=4){
          let g = gray[i/4];
          g = (g - lo) / range * 255;
          if(g<0) g=0; if(g>255) g=255;
          d[i] = d[i+1] = d[i+2] = g;
        }
        ctx.putImageData(imgData, 0, 0);

        const dataUrl = canvas.toDataURL('image/png');
        resolve(dataUrl);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function autoGrowTextarea(el){
  el.style.height = 'auto';

function cleanOcrText(text){
  // Tesseract辨識中文常會在每個字中間插入多餘空白，這裡把它清掉
  let cleaned = text;
  for (let i=0; i<3; i++){
    cleaned = cleaned.replace(/([\u4e00-\u9fff])[ \t]+(?=[\u4e00-\u9fff])/g, '$1');
  }
  return cleaned.replace(/[ \t]{2,}/g, ' ').trim();
}

function guessAmountFromText(text){
  // 優先抓「$」開頭的數字，取最大值（收據金額通常都有錢字符號，且總金額通常是$數字裡最大的一個；
  // 交易編號、商品重量(如200g)不會有$符號，可有效避開這類干擾）
  const dollarNums = (text.match(/\$\s?[\d,]+(?:\.\d+)?/g) || [])
    .map(s => parseFloat(s.replace(/[$,\s]/g,'')))
    .filter(n => n > 0 && n < 1000000);
  if(dollarNums.length > 0) return Math.max(...dollarNums);

  // 完全沒有$符號時，才退回找「小計/合計/應付」等關鍵字附近的數字，容許OCR在中文字間插入空白
  const keywords = ['小計','小結','合計','總計','總金額','應付金額','應付','實付','實收','消費金額','信用卡','現金'];
  for (const kw of keywords){
    const fuzzyKw = kw.split('').join('\\s*');
    const re = new RegExp(fuzzyKw + '[^\\d]{0,8}([\\d,]{1,9}(?:\\.\\d+)?)');
    const m = text.match(re);
    if (m){
      const n = parseFloat(m[1].replace(/,/g,''));
      if (n > 0 && n < 1000000) return n;
    }
  }

  // 最後備用：抓辨識出來的數字裡最大的那個（可能不準，需要人工確認）
  const nums = (text.match(/\d[\d,]*(\.\d+)?/g) || [])
    .map(s => parseFloat(s.replace(/,/g,'')))
    .filter(n => n > 0 && n < 1000000);
  if(nums.length===0) return '';
  return Math.max(...nums);
}

// 給雲端OCR用：單純縮圖，不做灰階/對比處理（雲端服務自己會處理彩色照片）
function getResizedDataUrl(file, maxWidth, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function ocrSpaceRecognize(imgDataUrl){
  const form = new FormData();
  form.append('apikey', OCR_SPACE_KEY);
  form.append('base64Image', imgDataUrl);
  form.append('language', 'cht');
  form.append('OCREngine', '2');
  form.append('scale', 'true');
  form.append('isOverlayRequired', 'false');
  const res = await fetch('https://api.ocr.space/parse/image', { method:'POST', body: form });
  const data = await res.json();
  if(data.IsErroredOnProcessing){
    throw new Error(Array.isArray(data.ErrorMessage) ? data.ErrorMessage.join(', ') : (data.ErrorMessage || 'OCR.space 辨識失敗'));
  }
  const text = (data.ParsedResults && data.ParsedResults[0] && data.ParsedResults[0].ParsedText) || '';
  if(!text.trim()) throw new Error('雲端辨識沒有讀到文字');
  return text;
}

function fillExpenseFormWithOcrText(text){
  editingExpenseId = null;
  document.getElementById('expenseFormTitle').textContent = '新增支出（拍照辨識）';
  document.getElementById('e-date').value = todayStr();
  renderCategorySelect();
  renderPaymentSelect();
  const cleaned = cleanOcrText(text);
  const guess = guessAmountFromText(cleaned);
  document.getElementById('e-amount').value = guess;
  const noteEl = document.getElementById('e-note');
  noteEl.value = cleaned.replace(/\n+/g,' ').trim();
  autoGrowTextarea(noteEl);
  expenseFormCard.classList.add('show');
  expenseFormCard.scrollIntoView({behavior:'smooth', block:'start'});
}

document.getElementById('cameraInput').addEventListener('change', async function(){
  const file = this.files && this.files[0];
  this.value = '';
  if(!file) return;

  showToast('雲端辨識中，請稍候...');
  try {
    const dataUrl = await getResizedDataUrl(file, 1600, 0.85);
    const text = await ocrSpaceRecognize(dataUrl);
    fillExpenseFormWithOcrText(text);
    showToast('雲端辨識完成，請確認金額後儲存');
    return;
  } catch(cloudErr){
    showToast('雲端辨識失敗，改用手機本機辨識...');
  }

  // 雲端失敗時，退回本機辨識當備援
  try {
    const imgSrc = await preprocessImageForOCR(file, 1800);
    const result = await Tesseract.recognize(imgSrc, 'chi_tra+eng', {
      logger: m=>{
        if(m.status === 'recognizing text'){
          showToast('本機辨識中... ' + Math.round(m.progress*100) + '%');
        }
      }
    });
    const rawText = result.data.text || '';
    if(!rawText.trim()){
      showToast('沒有辨識出文字，請手動輸入');
      editingExpenseId = null;
      document.getElementById('expenseFormTitle').textContent = '新增支出';
      document.getElementById('e-date').value = todayStr();
      renderCategorySelect();
      renderPaymentSelect();
      expenseFormCard.classList.add('show');
    } else {
      fillExpenseFormWithOcrText(rawText);
      showToast('本機辨識完成，請確認金額後儲存');
    }
  } catch(localErr){
    showToast('辨識時發生錯誤，請改用手動輸入');
    editingExpenseId = null;
    document.getElementById('expenseFormTitle').textContent = '新增支出';
    document.getElementById('e-date').value = todayStr();
    renderCategorySelect();
    renderPaymentSelect();
    expenseFormCard.classList.add('show');
  }
});


/* ============ 待辦事項 ============ */
let todos = JSON.parse(localStorage.getItem(STORAGE_TODOS) || '[]');
let editingTodoId = null;
function saveTodos(){ localStorage.setItem(STORAGE_TODOS, JSON.stringify(todos)); }

const todoFormCard = document.getElementById('todoFormCard');
document.getElementById('openTodoFormBtn').addEventListener('click', ()=>{
  editingTodoId = null;
  document.getElementById('todoFormTitle').textContent = '新增待辦事項';
  document.getElementById('t-name').value='';
  document.getElementById('t-priority').value='normal';
  document.getElementById('t-due').value='';
  todoFormCard.classList.add('show');
});
document.getElementById('closeTodoFormBtn').addEventListener('click', ()=>{
  todoFormCard.classList.remove('show');
  editingTodoId = null;
});
function editTodo(id){
  const t = todos.find(x=>x.id===id);
  if(!t) return;
  editingTodoId = id;
  document.getElementById('todoFormTitle').textContent = '編輯待辦事項';
  document.getElementById('t-name').value = t.name;
  document.getElementById('t-priority').value = t.priority;
  document.getElementById('t-due').value = t.due || '';
  todoFormCard.classList.add('show');
  todoFormCard.scrollIntoView({behavior:'smooth', block:'start'});
}
document.getElementById('saveTodoBtn').addEventListener('click', ()=>{
  const name = document.getElementById('t-name').value.trim();
  if(!name) return;
  const data = {
    name,
    priority: document.getElementById('t-priority').value,
    due: document.getElementById('t-due').value || null,
  };
  if(editingTodoId){
    todos = todos.map(t=> t.id===editingTodoId ? { ...t, ...data } : t);
    showToast('已更新待辦事項');
  } else {
    todos.unshift({ id: Date.now().toString(), ...data, done:false });
    showToast('已新增待辦事項');
  }
  saveTodos();
  editingTodoId = null;
  todoFormCard.classList.remove('show');
  renderTodos();
  renderReminders();
});
function toggleTodo(id){
  todos = todos.map(t=> t.id===id ? {...t, done:!t.done} : t);
  saveTodos();
  renderTodos();
  renderReminders();
}
function deleteTodo(id){
  todos = todos.filter(t=>t.id!==id);
  saveTodos();
  renderTodos();
  renderReminders();
}
function renderTodos(){
  const listEl = document.getElementById('todoList');
  const emptyEl = document.getElementById('todoEmpty');
  const badge = document.getElementById('todoBadge');
  listEl.innerHTML = '';
  emptyEl.style.display = todos.length===0 ? 'flex' : 'none';

  const sorted = [...todos].sort((a,b)=>{
    if(a.done !== b.done) return a.done ? 1 : -1;
    if(a.priority !== b.priority) return a.priority==='high' ? -1 : 1;
    return 0;
  });

  sorted.forEach(t=>{
    const row = document.createElement('div');
    row.className = 'todo-row' + (t.done ? ' done' : '');
    row.innerHTML = `
      <div class="checkbox ${t.done?'on':''}">${t.done?'✓':''}</div>
      <div style="flex:1;">
        <div class="todo-name"></div>
        ${t.due ? '<div class="todo-due"></div>' : ''}
      </div>
      <span class="pri-tag ${t.priority==='high'?'pri-high':'pri-normal'}">${t.priority==='high'?'急':'普通'}</span>
      <button class="icon-btn edit-todo-btn">✏️</button>
      <button class="icon-btn del-todo-btn">✕</button>
    `;
    row.querySelector('.todo-name').textContent = t.name;
    if(t.due) row.querySelector('.todo-due').textContent = '到期：'+t.due;
    row.querySelector('.checkbox').addEventListener('click', ()=>toggleTodo(t.id));
    row.querySelector('.edit-todo-btn').addEventListener('click', ()=>editTodo(t.id));
    row.querySelector('.del-todo-btn').addEventListener('click', ()=>deleteTodo(t.id));
    listEl.appendChild(row);
  });

  const pendingCount = todos.filter(t=>!t.done).length;
  if(pendingCount>0){ badge.style.display='flex'; badge.textContent=pendingCount; }
  else { badge.style.display='none'; }
}

/* ============ 頂端提醒橫幅 ============ */
function renderReminders(){
  const wrap = document.getElementById('reminderWrap');
  wrap.innerHTML = '';
  const today = todayStr();
  const overdue = todos.filter(t=>!t.done && t.due && t.due < today);
  const dueToday = todos.filter(t=>!t.done && t.due && t.due === today);

  overdue.forEach(t=>{
    const el = document.createElement('div');
    el.className = 'reminder-banner';
    el.innerHTML = `⚠️ <span><b>已逾期：</b>${t.name}</span>`;
    el.addEventListener('click', ()=>{
      document.querySelector('.bt-item[data-tab="todo"]').click();
    });
    wrap.appendChild(el);
  });
  dueToday.forEach(t=>{
    const el = document.createElement('div');
    el.className = 'reminder-banner today';
    el.innerHTML = `🔔 <span><b>今天到期：</b>${t.name}</span>`;
    el.addEventListener('click', ()=>{
      document.querySelector('.bt-item[data-tab="todo"]').click();
    });
    wrap.appendChild(el);
  });
}

renderRecipes();

renderExpenses();
renderTodos();
renderReminders();
